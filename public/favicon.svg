<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0a0a14"/>
  <!-- Outer Web Diamond -->
  <path d="M 32 6 L 58 32 L 32 58 L 6 32 Z" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" filter="url(#glow)" />
  <!-- Inner Spider Web Threads -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#00f3ff" stroke-width="1.5" opacity="0.8" />
  <line x1="6" y1="32" x2="58" y2="32" stroke="#ff0055" stroke-width="1.5" opacity="0.8" />
  <line x1="13.5" y1="13.5" x2="50.5" y2="50.5" stroke="#ffe600" stroke-width="1.5" opacity="0.7" />
  <line x1="50.5" y1="13.5" x2="13.5" y2="50.5" stroke="#ffe600" stroke-width="1.5" opacity="0.7" />
  <!-- Concentric Web Rings -->
  <polygon points="32,16 48,32 32,48 16,32" fill="none" stroke="#00f3ff" stroke-width="1.5" opacity="0.8"/>
  <polygon points="32,24 40,32 32,40 24,32" fill="none" stroke="#ff0055" stroke-width="1.5" />
  <!-- Center Glowing Core Node -->
  <circle cx="32" cy="32" r="4" fill="#00f3ff" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />
</svg>
